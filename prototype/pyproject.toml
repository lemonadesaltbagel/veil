[project]
name = "veil-proxy"
version = "0.3.0"
description = "Privacy middleware for AI coding agents: the model sees consistent pseudonyms, your machine keeps the real values"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["privacy", "pii", "llm", "proxy", "pseudonymization", "claude-code", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.27",
    "pyahocorasick>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/lemonadesaltbagel/veil"
Repository = "https://github.com/lemonadesaltbagel/veil"
Issues = "https://github.com/lemonadesaltbagel/veil/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.6"]
mysql = ["pymysql>=1.2.3"]
mongo = ["pymongo>=4.19.0"]
redis = ["redis>=8.1.0"]
bedrock = ["botocore>=1.43.115"]
ner = ["gliner>=0.2.29", "onnxruntime>=1.31.0"]
mssql = ["pymssql>=2.3"]  # not in `all`: building it from source needs FreeTDS
snowflake = ["snowflake-connector-python>=3.12"]  # not in `all`: large
all = ["veil-proxy[postgres,mysql,mongo,redis,bedrock]"]

[project.scripts]
veil = "veil.cli:main"
veil-hook = "veil.hookclient:cli"

[dependency-groups]
dev = [
    "anthropic>=1.15.0",
    "botocore>=1.43.115",
    "mongomock>=4.3.0",
    "openai>=3.35.1",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "veil-proxy[all]",
]

[tool.uv.sources]
veil-proxy = { workspace = true }

# Ship only the runtime package `veil/`. Development tooling lives in `veil_dev/` (audits, fake models,
# bypass matrix) next to tests/, scripts/ and datasets/, none of which are packaged.
[tool.flit.module]
name = "veil"

[tool.pytest.ini_options]
pythonpath = ["."]
faulthandler_timeout = 120  # a hung test dumps every thread's stack (CI diagnosis)   # makes veil_dev importable for the test suite

[build-system]
# Pure-Python backend: building the sdist needs no compiler (Homebrew builds from source).
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"
